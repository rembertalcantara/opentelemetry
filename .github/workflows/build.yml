name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Show managed OpenTelemetry version
        run: mvn -B -q help:evaluate -Dexpression=opentelemetry.version -DforceStdout -N || true
      - name: Build and test
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        module: [order-service, inventory-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.module }} image
        run: docker build --build-arg MODULE=${{ matrix.module }} -t ${{ matrix.module }}:ci .
